project:
  name: fifa_public_sentiment_pull

output:
  path: output/results.csv
  save_source_files: true

keywords:
  event_terms:
    - "Qatar 2022"
    - "Qatar World Cup"
    - "FIFA World Cup Qatar"
    - "Saudi 2034"
    - "Saudi World Cup"
  issue_terms:
    - "human rights"
    - "migrant workers"
    - "labor"
    - "fan experience"
    - "tourism"
    - "soft power"
    - "sportswashing"
    - "legacy"
    - "national image"
  arabic_terms:
    - "مونديال قطر"
    - "كأس العالم قطر"
    - "السعودية 2034"

time_windows:
  pre_event:
    start_date: "2021-11-01"
    end_date: "2022-11-19"
  event:
    start_date: "2022-11-20"
    end_date: "2022-12-18"
  post_event:
    start_date: "2022-12-19"
    end_date: "2023-06-30"
  saudi_2034:
    start_date: "2023-10-01"
    end_date: "2026-05-20"

sources:
  gdelt:
    enabled: true
    max_records_per_keyword: 25

  web_scraper:
    enabled: true
    urls:
      - "https://www.fifa.com/en/tournaments/mens/worldcup/qatar2022"
      - "https://www.fifa.com/en/tournaments/mens/worldcup/saudiarabia2034"

  youtube:
    enabled: false
    max_videos_per_keyword: 5
    max_comments_per_video: 100

  reddit:
    enabled: false
    subreddits:
      - soccer
      - worldcup
      - qatar
      - saudiarabia
    max_posts_per_keyword: 50
    max_comments_per_post: 25

  twitter:
    enabled: false
    max_posts_per_keyword: 100
    note: "Placeholder only. Historical X/Twitter requires API access."
